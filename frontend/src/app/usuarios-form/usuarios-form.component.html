<div class="container-fluid vh-100 p-0">
  <div class="row h-100 m-0">

    <!-- FORMULARIO -->
    <div class="col-md-6 d-flex align-items-center justify-content-center"
         style="background-color: #2b1b3a; color: white;">

      <div style="width: 80%; max-width: 400px;">
        <h2 class="mb-4 text-center"><em>Bienvenido a Nuvosa</em></h2>

        <form [formGroup]="form" (ngSubmit)="saveUsuario()" class="w-100">

          <!-- Nombre -->
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control"
              formControlName="nombreUsuario"
              placeholder="Ingrese su nombre">

            <div class="text-danger mt-1"
              *ngIf="form.get('nombreUsuario')?.touched && form.get('nombreUsuario')?.invalid">
              Mínimo 3 caracteres
            </div>
          </div>

          <!-- Correo -->
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control"
              formControlName="correoUsuario"
              placeholder="Ingrese su correo">

            <div class="text-danger mt-1"
              *ngIf="form.get('correoUsuario')?.touched && form.get('correoUsuario')?.invalid">
              Correo inválido
            </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control"
              formControlName="contrasenaUsuario"
              placeholder="Ingrese su contraseña">

            <div class="text-danger mt-1"
              *ngIf="form.get('contrasenaUsuario')?.touched && form.get('contrasenaUsuario')?.invalid">
              Mínimo 6 caracteres
            </div>
          </div>

          <!-- Botón -->
          <div class="d-grid mb-3">
            <button type="submit"
              class="btn"
              style="background-color: #8a5d7f; color: black; font-weight: bold;">
              Crear Cuenta
            </button>
          </div>

        </form>

        <!-- Sociales -->
        <p class="text-center"><small>Puedes ingresar con:</small></p>
        <div class="d-flex justify-content-between">
          <button class="btn btn-light d-flex align-items-center justify-content-center" style="gap: 8px; width:48%;">
            <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" style="height:20px;">
            Google
          </button>

          <button class="btn btn-primary d-flex align-items-center justify-content-center" style="gap: 8px; width:48%;">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" style="height:20px;">
            Facebook
          </button>
        </div>

      </div>
    </div>

    <!-- IMAGEN -->
    <div class="col-md-6 d-none d-md-block p-0">
      <img src="/assets/ilustracion-nuvosa.png"
        class="w-100 h-100"
        style="object-fit: cover;">
    </div>

  </div>
</div>
