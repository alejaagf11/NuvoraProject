<div class="container-fluid main-vh-100 p-0">
  <div class="row h-100 m-0">

    <div class="col-md-12 p-5 main-content">

      <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
          <h2 class="fw-bold mb-3">Usuarios Registrados</h2>
          <p class="mb-0">Aquí puedes ver todos los usuarios de la plataforma</p>
        </div>
        <div class="profile-icon">👤</div>
      </div>

      <div class="mt-4">
        <p *ngIf="cargando" class="text-center" style="color: #999;">Cargando usuarios...</p>
        
        <div *ngIf="error" class="alert alert-danger" style="background-color: #5d1a1a; border-color: #d32f2f;">
          {{ error }}
        </div>

        <div *ngIf="usuarios.length > 0 && !cargando" class="table-responsive">
          <table class="table" style="background-color: #2b1b3a; color: white; border: 1px solid #555;">
            <thead>
              <tr style="border-bottom: 2px solid #8a5d7f;">
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let usuario of usuarios" style="border-bottom: 1px solid #555;">
                <td>{{ usuario.nombreUsuario }}</td>
                <td>{{ usuario.correoUsuario }}</td>
                <td>
                  <span class="badge" [ngClass]="usuario.rolUsuario === 'ADMIN' ? 'bg-danger' : 'bg-success'">
                    {{ usuario.rolUsuario || 'USER' }}
                  </span>
                </td>
                <td>
                  <button type="button" class="btn btn-sm btn-warning me-2" [routerLink]="['/usuarios-form', usuario.usuarioId]">
                    Editar
                  </button>
                  <button type="button" class="btn btn-sm btn-danger" (click)="deleteUsuario(usuario.usuarioId!)">
                    Eliminar
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <p *ngIf="usuarios.length === 0 && !cargando" class="text-center mt-4" style="color: #999;">
          No hay usuarios registrados aún
        </p>
      </div>

    </div>

  </div>
</div>
