<main class="mobile-page">
  <header class="topbar">
    <button type="button" class="icon-button" routerLink="/mobile/dashboard">‹</button>
    <div>
      <p class="eyebrow">Educacion</p>
      <h1>Aprendizaje</h1>
    </div>
    <button type="button" class="avatar-button" routerLink="/mobile/cuenta">N</button>
  </header>

  <section *ngIf="cargando" class="state-card">Cargando modulos...</section>
  <section *ngIf="errorMensaje" class="state-card error">{{ errorMensaje }}</section>

  <section class="module-list">
    <article
      *ngFor="let modulo of modulos"
      class="module-card"
      [class.locked]="!modulo.desbloqueado"
      (click)="verModulo(modulo.moduloId, modulo.desbloqueado)"
    >
      <div class="module-header">
        <span>Modulo {{ modulo.ordenModulo }}</span>
        <strong>{{ modulo.porcentajeProgreso || 0 }}%</strong>
      </div>
      <h2>{{ modulo.tituloModulo }}</h2>
      <p>{{ modulo.descripcionModulo }}</p>
      <div class="progress">
        <div [style.width.%]="modulo.porcentajeProgreso || 0"></div>
      </div>
      <small>{{ modulo.desbloqueado ? 'Tocar para continuar' : 'Bloqueado' }}</small>
    </article>
  </section>

  <nav class="bottom-nav" aria-label="Navegacion movil">
    <a routerLink="/mobile/dashboard">Inicio</a>
    <a routerLink="/mobile/transacciones">Movs.</a>
    <a routerLink="/mobile/presupuesto">Presup.</a>
    <a routerLink="/mobile/cuenta">Cuenta</a>
  </nav>
</main>
